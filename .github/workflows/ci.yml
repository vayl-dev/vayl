name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (package + dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Import smoke test
        run: python -c "from vayl.api import mcp_server, server; from vayl.storage import store, graph_store; from vayl.memory import llm_memory, reconcile; from vayl.telemetry import metrics; from vayl.security import crypto, audit; print('runtime imports OK')"

      - name: Unit tests (offline, deterministic)
        run: pytest

      - name: Dependency vulnerability audit
        # Blocking: a known-vulnerable dependency fails CI. pip is upgraded first so the audit judges
        # our dependency set, not the runner's bundled pip.
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off

  integration:
    # Postgres and Neo4j backends against real servers. These suites skip when their database is
    # unreachable, and a skip reads as a pass — so this job fails if anything is skipped.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vayl
          POSTGRES_PASSWORD: vayl
          POSTGRES_DB: vayl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayl" --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-only-throwaway   # ephemeral CI container, not a real credential
        ports: ["7687:7687"]
    env:
      VAYL_TEST_DATABASE_URL: postgresql://vayl:vayl@localhost:5432/vayl
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (package + Postgres and graph extras)
        run: pip install -e ".[dev,postgres,graph]"

      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import os, time
          from neo4j import GraphDatabase
          for _ in range(60):
              try:
                  d = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=("neo4j", os.environ["NEO4J_PASSWORD"]))
                  d.verify_connectivity(); d.close(); print("neo4j ready"); break
              except Exception:
                  time.sleep(3)
          else:
              raise SystemExit("neo4j did not become ready")
          PY

      - name: Postgres + Neo4j integration tests (fail on any skip)
        shell: bash   # pipefail: pytest's exit status must survive the tee
        run: |
          pytest tests/test_postgres.py tests/test_graph_store.py -o addopts="" -q -rs | tee pytest.out
          if grep -qE "[0-9]+ skipped" pytest.out; then echo "::error::integration tests were skipped"; exit 1; fi
