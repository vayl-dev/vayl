name: npm publish

# Publish the TypeScript client (clients/typescript) to npm on a `ts-v*` tag
# (e.g. `ts-v0.1.0`). Authenticates with the `NPM_TOKEN` repo secret and attaches
# build provenance (OIDC id-token). The tag drives the release.
#
# Setup: add a granular, publish-only npm access token as the `NPM_TOKEN` GitHub
# Actions secret (Settings → Secrets and variables → Actions). Use a freshly rotated
# token — never one that has been pasted anywhere. To move to tokenless publishing
# later, register a Trusted Publisher on npm (repo vayl-dev/vayl, workflow
# npm-publish.yml) and drop the NODE_AUTH_TOKEN env below.

on:
  push:
    tags:
      - "ts-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    permissions:
      id-token: write   # OIDC token for npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Verify the tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#ts-v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag ts-v$TAG does not match package.json $PKG"; exit 1; }
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish to npm (token auth + build provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
