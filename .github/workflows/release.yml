name: release

# Publish to PyPI on a version tag (e.g. `v0.1.0`), via PyPI Trusted Publishing
# (OIDC — no stored API tokens). The tag drives the release; PyPI verifies the
# workflow identity. Configure the trusted publisher once at
# https://pypi.org/manage/project/vayl-mcp/settings/publishing/
# (owner: vayl-dev, repo: vayl, workflow: release.yml, environment: pypi).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment must match the one set on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/vayl-mcp/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
