name: release

# Publish to PyPI on a version tag (e.g. `v0.1.0`), via PyPI Trusted Publishing
# (OIDC — no stored API tokens). The tag drives the release; PyPI verifies the
# workflow identity. Configure the trusted publisher once at
# https://pypi.org/manage/project/vayl-mcp/settings/publishing/
# (owner: vayl-dev, repo: vayl, workflow: release.yml, environment: pypi).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment must match the one set on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/vayl-mcp/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
