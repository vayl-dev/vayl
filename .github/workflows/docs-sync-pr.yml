name: docs sync PR

# GitBook Git Sync pushes docs to the `docs-sync` branch (main is protected, so GitBook
# can't push there directly). This opens — or reuses — a pull request from `docs-sync`
# into `main`, so synced docs land through CI + review instead of bypassing protection.
#
# Requires the repo setting: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" (enabled during setup).

on:
  push:
    branches: [docs-sync]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse the docs-sync → main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$REPO/compare/main...docs-sync" --jq '.ahead_by')
          echo "docs-sync is ${ahead} commit(s) ahead of main."
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing to sync — docs-sync is not ahead of main."
            exit 0
          fi
          open=$(gh api "repos/$REPO/pulls?base=main&head=${OWNER}:docs-sync&state=open" --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "A docs-sync → main PR is already open; the new commit is included automatically."
            exit 0
          fi
          gh api "repos/$REPO/pulls" \
            -f title="docs: sync from GitBook" \
            -f head="docs-sync" \
            -f base="main" \
            -f body="Automated by \`docs-sync-pr.yml\`. GitBook Git Sync pushed new docs to \`docs-sync\`; merging brings them onto \`main\` through CI and review. Preview the rendered pages at https://vayl.gitbook.io/vayl-docs"
