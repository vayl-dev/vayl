# OpenSSF Scorecard — scores the repo against supply-chain / security best practices,
# publishes the result to the public dashboard, and feeds the README badge.
# https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security

on:
  # Re-score whenever branch protection changes (a Scorecard signal).
  branch_protection_rule:
  # Weekly, so the score stays current as the ecosystem's checks evolve.
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]

# Least privilege by default; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the OpenSSF dashboard (badge)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # A fine-grained PAT with `Administration: read` lets Scorecard read the
          # repo's branch-protection settings (the default token can't). Falls back
          # to the workflow token if the secret isn't set — so this is safe either way.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          # Publish to the public Scorecard dashboard so the README badge resolves.
          publish_results: true

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          sarif_file: results.sarif
